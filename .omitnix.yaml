# omitnix, pointed at itself.
#
# `fail_on_unknown` is on here and off everywhere by default. This repository is the one
# place where every unreadable file is somebody-in-this-repository's to fix: the adapters
# are here. Elsewhere the same setting would demand a written excuse for each thing no
# adapter claims, including gaps the repository has no power to close, so it is opt-in.
# Keeping it on here also means the strict path has a user and cannot quietly rot.
fail_on_unknown: true
#
# The tool's contract is that everything it discovers must be analyzed, so the only way
# to make a run pass is to widen what an adapter understands or to write down, here, why
# a path is not the tool's business. That makes this file the honest part of the run: an
# exclusion is a decision on the record, not a way to turn a red run green.
#
# Every exclusion below belongs to exactly one of four reasons. They are kept in separate
# blocks on purpose, because the fourth is temporary and the first three are not, and
# letting a temporary gap sit among permanent ones is how it becomes permanent.
#
#   A  not produced here      caches, tool state, and links to stores outside this repo
#   B  not program source     prose and declarative data; there is nothing to inventory
#   C  deliberately abnormal  test inputs whose whole point is to be unanalyzable
#   D  no adapter yet         real program source that MUST come back in scope
#
# `include` is left at its default (`**/*`). Discovery stays blunt on purpose: a narrow
# include list would also narrow `--gate`, which filters new files through these same
# rules, and a new file type nobody anticipated is precisely what must not pass unseen.

exclude:
  # --- A. Not produced here -------------------------------------------------------
  # Regenerated by a tool on demand and untracked. Nothing here is authored, so there
  # is no state of the world an inventory of it could describe.
  - "**/__pycache__/**"
  - ".pytest_cache/**"
  - ".ruff_cache/**"
  # Local state written by editor and note-keeping tooling, untracked.
  - ".cursor/**"
  - ".docsweep/**"
  # Private working notes, untracked in a public repository.
  - "docs/local/**"
  # A link to a knowledge store that lives outside this repository. Walking it would
  # inventory someone else's tree and report it as this project's content.
  - "docs/obsidian/**"

  # --- B. Not program source ------------------------------------------------------
  # This tool inventories programs: what a file does, whether it checks who is calling,
  # and which tables it touches. Prose and declarative data have none of those, and an
  # adapter for them would have nothing to report but a title.
  - "**/*.md"
  - "**/*.mdc"
  - "**/*.txt"
  - "LICENSE"
  - "**/.gitignore"
  - "**/.gitattributes"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.toml"
  - "**/*.json"
  - "**/*.tag"
  # tree-sitter query files. They are data read by an adapter, not code that runs.
  - "**/*.scm"

  # --- C. Deliberately abnormal test input ----------------------------------------
  # Fixtures exist to be fed to the analyzer under conditions the shipped tool never
  # sees, and two of them are unanalyzable by design:
  #   * tests/fixtures/php/broken.php contains a syntax error on purpose, and
  #     tests/test_php_adapter.py asserts that it is counted as unknown and fails a run.
  #   * tests/fixtures/new/ holds files whose extensions are claimed by drop-in adapters
  #     that only exist while pytest is running.
  # The test suite already asserts what each of these must produce. Re-litigating it in
  # the repository's own inventory would mean either an inventory that cannot pass or a
  # fixture weakened until it does. This does set aside ten ordinary PHP fixtures too;
  # they are inputs to tests rather than code this project ships.
  - "tests/fixtures/**"

  # --- D. No adapter yet ----------------------------------------------------------
  # THESE ARE PROGRAM SOURCE AND BELONG IN THE INVENTORY. Each line is here only
  # because no adapter claims it today, and each must be deleted when one does.
  # Anything that stays in this block after its adapter ships is a hole in the
  # inventory of exactly the kind this tool was written to make impossible.
  #
  # Emptied of extensions on 2026-09-08: the Python, JS/TS, PowerShell, shell and HTML
  # adapters shipped, so `*.py` `*.mjs` `*.ps1` `*.sh` `*.html` came back into scope on
  # the same day. Only one entry is left, and it is not an extension:
  #
  # A shell script with no extension. Adapters are selected by extension, so the shell
  # adapter does not pick this up; it would need a rule for reading the shebang line.
  - ".githooks/pre-commit"

# Left unset on purpose:
#
#   authentication_functions / authorization_functions
#     This repository has no session and no database, so there is no call whose absence
#     would mean anything. Naming one here to make the columns look populated would put
#     a check in the report that nothing behind it enforces.
#
#   schema_snapshot
#     Nothing here talks to a database.
#
#   gate_exemptions
#     None. An exemption is a standing promise that a check does not apply, and there is
#     no file here making that claim.
